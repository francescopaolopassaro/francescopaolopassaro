<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <style>
      .bg { fill: #6C5EB5; }
      .screen { fill: #352879; }
      .text { fill: #A8BCE4; font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; }
      .highlight { fill: #FFFFFF; font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; }
      .cursor { fill: #A8BCE4; }
      .ok { fill: #55FF55; font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Sfondo e Schermo C64 -->
  <rect class="bg" width="800" height="500" />
  <rect class="screen" x="40" y="40" width="720" height="420" />

  <!-- Testo di Boot Statico -->
  <text class="text" x="60" y="70">**** COMMODORE 64 BASIC V2 ****</text>
  <text class="text" x="60" y="100">64K RAM SYSTEM  38911 BASIC BYTES FREE</text>

  <!-- Sequenza di Digitazione (Typewriter Effect) -->
  <g class="text">
    <text x="60" y="150" opacity="0">READY.<animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.05s" fill="freeze"/></text>
    
    <text x="60" y="190" opacity="0">LOAD "F.PASSARO",8,1<animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.05s" fill="freeze"/></text>
    
    <text x="60" y="220" opacity="0">SEARCHING FOR F.PASSARO<animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.05s" fill="freeze"/></text>
    
    <text x="60" y="250" opacity="0">LOADING...<animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.05s" fill="freeze"/></text>
    
    <!-- Animazione puntini di caricamento -->
    <text x="145" y="250" opacity="0">
      .<animate attributeName="opacity" values="0;1;0;1;0;1;0;1" begin="3.2s" dur="0.3s" fill="freeze"/>
    </text>

    <text x="60" y="300" opacity="0">READY.<animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.05s" fill="freeze"/></text>
    
    <text x="60" y="340" opacity="0">RUN<animate attributeName="opacity" values="0;1" begin="5.2s" dur="0.05s" fill="freeze"/></text>
  </g>

  <!-- Titolo Principale a comparsa progressiva (Typewriter) -->
  <g class="highlight">
    <text x="60" y="390" opacity="0">> SOLUTION ARCHITECT<animate attributeName="opacity" values="0;1" begin="6.0s" dur="0.05s" fill="freeze"/></text>
    <text x="60" y="390" opacity="0">> SOLUTION ARCHITECT | TEAM LEADER<animate attributeName="opacity" values="0;1" begin="6.6s" dur="0.05s" fill="freeze"/></text>
    <text x="60" y="390" opacity="0">> SOLUTION ARCHITECT | TEAM LEADER | AI SYSTEMS ENGINEER<animate attributeName="opacity" values="0;1" begin="7.2s" dur="0.05s" fill="freeze"/></text>
  </g>

  <!-- Sequenza di Caricamento Profilo -->
  <g class="text">
    <text x="60" y="430" opacity="0">> INITIALIZING SECURE AI ECOSYSTEMS... <tspan class="ok">[OK]</tspan><animate attributeName="opacity" values="0;1" begin="8.0s" dur="0.05s" fill="freeze"/></text>
    <text x="60" y="460" opacity="0">> MOUNTING 20+ YEARS OF EXPERIENCE... <tspan class="ok">[OK]</tspan><animate attributeName="opacity" values="0;1" begin="8.8s" dur="0.05s" fill="freeze"/></text>
  </g>

  <!-- Cursore Lampeggiante Finale -->
  <rect class="cursor" x="580" y="440" width="12" height="18" opacity="0">
    <!-- Appare alla fine della sequenza -->
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1;1" begin="9.5s" dur="0.8s" fill="freeze" />
    <!-- Poi lampeggia all'infinito -->
    <animate attributeName="opacity" values="1;0;1" begin="10.3s" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
