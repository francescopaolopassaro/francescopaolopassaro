<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="700">
  <rect width="800" height="700" fill="#4040e0" rx="4"/>

  <defs>
    <pattern id="sl" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect width="800" height="1.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
    <radialGradient id="vg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </radialGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="700" fill="url(#sl)" rx="4" pointer-events="none"/>
  <rect width="800" height="700" fill="url(#vg)" rx="4" pointer-events="none"/>

  <style>
    @keyframes show{to{opacity:1}}
    @keyframes blink{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
    @keyframes cFade{0%{opacity:0}5%{opacity:1}20%{opacity:0}35%{opacity:1}50%{opacity:0}65%{opacity:1}80%{opacity:0}100%{opacity:0}}
    .b{font-family:'Courier New',monospace;fill:#b0b0ff;font-size:16px;opacity:0;animation:show .12s ease-out forwards;filter:url(#gl)}
    .a{font-family:'Courier New',monospace;fill:#b0b0ff;font-size:11px;opacity:0;animation:show .06s ease-out forwards;filter:url(#gl)}
    .c1{font-family:'Courier New',monospace;fill:#b0b0ff;font-size:16px;opacity:0;animation:cFade 1.5s 3.8s forwards;filter:url(#gl)}
    .c2{font-family:'Courier New',monospace;fill:#b0b0ff;font-size:16px;opacity:0;animation:show .12s 9.2s ease-out forwards,blink .5s 9.7s infinite;filter:url(#gl)}
  </style>

